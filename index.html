<!DOCTYPE html>
<html lang="en">
<head>

<title>Word Guess: 5-Letter Word Game</title>
<style>
/* ===== Glassmorphism theme ===== */
:root{
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --main-width:30vw; --main-width-900:100vw;
  --text:#1b1b3a; --text-soft:rgba(27,27,58,.68);
  --bg-a:#c7d2fe; --bg-b:#fbcfe8; --bg-c:#a5f3fc;
  --orb1:#a78bfa; --orb2:#f472b6; --orb3:#22d3ee;
  --glass:rgba(255,255,255,.38); --glass-strong:rgba(255,255,255,.58);
  --glass-border:rgba(255,255,255,.65); --glass-hi:rgba(255,255,255,.75);
  --shadow:0 8px 32px rgba(70,60,140,.22); --shadow-sm:0 4px 14px rgba(70,60,140,.16);
  --ok:rgba(16,185,129,.72); --warn:rgba(245,158,11,.74); --miss:rgba(71,63,120,.62);
  --blur:blur(18px) saturate(170%);
  --opt-bg:#f3f0ff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --text:#f4f2ff; --text-soft:rgba(244,242,255,.7);
    --bg-a:#0f0c29; --bg-b:#302b63; --bg-c:#1b2a49;
    --orb1:#7c3aed; --orb2:#db2777; --orb3:#0891b2;
    --glass:rgba(255,255,255,.09); --glass-strong:rgba(255,255,255,.16);
    --glass-border:rgba(255,255,255,.22); --glass-hi:rgba(255,255,255,.35);
    --shadow:0 8px 32px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35);
    --ok:rgba(16,185,129,.6); --warn:rgba(245,158,11,.62); --miss:rgba(15,12,41,.6);
    --opt-bg:#1d1840; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --text:#f4f2ff; --text-soft:rgba(244,242,255,.7);
  --bg-a:#0f0c29; --bg-b:#302b63; --bg-c:#1b2a49;
  --orb1:#7c3aed; --orb2:#db2777; --orb3:#0891b2;
  --glass:rgba(255,255,255,.09); --glass-strong:rgba(255,255,255,.16);
  --glass-border:rgba(255,255,255,.22); --glass-hi:rgba(255,255,255,.35);
  --shadow:0 8px 32px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --ok:rgba(16,185,129,.6); --warn:rgba(245,158,11,.62); --miss:rgba(15,12,41,.6);
  --opt-bg:#1d1840; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none !important}
html{background:var(--bg-a)}
body{
  width:100% !important; color:var(--text) !important; font-family:var(--font);
  background:linear-gradient(135deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c)) fixed !important;
  text-align:center; height:100%; overflow:auto; position:relative;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  -webkit-font-smoothing:antialiased;
}
/* floating colour orbs behind the glass */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none}
body::before{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,var(--orb1),transparent 68%)}
body::after{width:42vmax;height:42vmax;right:-12vmax;bottom:-14vmax;background:radial-gradient(circle,var(--orb2),transparent 68%)}
#loading-screen{background:linear-gradient(135deg,#0f0c29,#302b63) !important;font-family:var(--font)}

/* header */
.logoVersionTag{font-weight:800;font-size:24px;margin-left:10px;letter-spacing:-.02em}
.versionTag{width:var(--main-width);display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-radius:18px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.logo{border-radius:7px;box-shadow:var(--shadow-sm)}
.version{font-size:10px;color:var(--text-soft);font-weight:600}

/* buttons */
button,select{font-family:var(--font);color:var(--text)}
button{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;cursor:pointer;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi);transition:transform .15s,filter .15s,background .2s}
button:hover{background:var(--glass-strong);transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible,select:focus-visible{outline:2px solid var(--orb3);outline-offset:2px}
.settings{margin-left:10px;padding:2px;border-radius:50% !important;width:34px;height:34px}
.settings img{width:16px}
.install{padding:3px 6px;border-radius:10px}
.install img{width:20px}
.settings img,.install img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}

/* board */
.game-board{width:var(--main-width);height:55vh;margin:10px auto 150px}
.game-board-row{width:100%;height:20%;display:flex;flex-direction:row;border:0;justify-content:space-around}
.game-board-col{width:20%;height:100%;padding:3px;border:0;background:none}
.letterInput{
  width:100% !important;height:100% !important;font:800 3vw/1 var(--font) !important;text-transform:uppercase;
  text-align:center !important;cursor:pointer !important;user-select:none !important;pointer-events:none !important;
  color:var(--text) !important;background:var(--glass) !important;border:1px solid var(--glass-border) !important;
  border-radius:16px !important;outline:none;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi);transition:background .3s,box-shadow .3s}
.correctLetterCorrectPlace{color:#fff !important;background:var(--ok) !important;box-shadow:0 6px 22px rgba(16,185,129,.45),inset 0 1px 0 rgba(255,255,255,.5) !important;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.correctLetterWrongPlace{color:#fff !important;background:var(--warn) !important;box-shadow:0 6px 22px rgba(245,158,11,.45),inset 0 1px 0 rgba(255,255,255,.5) !important;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.wrongLetter{color:#fff !important;background:var(--miss) !important;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.correctLetterCorrectPlaceAdd,.correctLetterWrongPlaceAdd,.wrongLetterAdd{width:20px !important;height:20px !important;display:inline-block;border-radius:6px !important;vertical-align:middle;margin-right:6px}

/* keyboard */
.keyboard{width:var(--main-width);height:10vw;margin:10px auto}
.keyboard-button{width:50px;height:50px;border-radius:12px;font-weight:700;user-select:none;position:relative}
.wide-button{width:100px}
.keyboard-button:hover{background:var(--glass-strong)}
.keyboard-button.original{background:rgba(253,224,71,.5);color:var(--text)}
.keyboard-button.original::after{content:'PRESS';font-size:7px;position:absolute;bottom:2px;right:8px;
  background:rgba(251,146,60,.9);color:#fff;padding:2px 4px;border-radius:5px}
.keyboard-button.alternative{background:rgba(250,204,21,.55);color:#7c2d12}
.keyboard-button-correct-letter-correct-place{background:var(--ok) !important;color:#fff}
.keyboard-button-correct-letter-wrong-place{background:var(--warn) !important;color:#fff}
.keyboard-button-wrong-letter{background:var(--miss) !important;color:#fff;opacity:.8}

/* panels */
.infoBox,.largeMessageBox,.showTheMeaningDiv{
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);color:var(--text)}
.infoBox{width:220px;height:auto;position:absolute;top:30px;right:0;display:block;padding:16px;text-align:left;margin-right:20px;font-size:14px;line-height:1.6}
.infoBox h5{font-weight:800;font-size:15px;letter-spacing:.04em;margin-bottom:8px}
.infoBox a{color:var(--text)}
.largeMessageBox{display:none;top:46px;width:var(--main-width);height:66vh;padding:40px 20px;position:absolute;font-size:20px}
.largeMessageBox .askedWord{font-size:30px;font-weight:800;color:#ec4899}
.largeMessageBox p{color:var(--text);padding-top:30px;font-size:20px}
.largeMessageBox ul{text-align:left;padding-left:20px;list-style:disc}
.largeMessageBox ul li{text-align:left;margin-bottom:10px;color:var(--text)}
.close-info{width:50vw;margin:20px auto;display:none;padding:14px 20px;font-weight:700}
.showTheMeaningDiv{text-align:left;width:300px;margin:0 auto;top:30px;position:absolute;padding:10px;overflow-y:auto}

/* toasts */
.toastContainer{position:absolute;height:99vh;width:320px;z-index:9999;top:0;right:0;background:transparent;border:0;display:flex;flex-direction:column-reverse;flex-wrap:nowrap;justify-content:flex-start;align-items:center;overflow-y:hidden;padding-bottom:60px;pointer-events:none}
.toast{width:300px;height:60px;text-align:left;padding:10px 14px;font-size:14px;font-weight:600;line-height:1.3;
  background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-left:5px solid var(--orb3);border-radius:14px;color:var(--text);
  box-shadow:var(--shadow);transition:opacity 1s ease;flex-shrink:0;margin-bottom:10px}
.warning{border-left-color:#ec4899}.info{border-left-color:#22d3ee}.message{border-left-color:#facc15}
.success{border-left-color:#10b981}.error{border-left-color:#ef4444}

/* dialog */
dialog{opacity:0;transform:scaleY(0);color:var(--text);font-family:var(--font);
  background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
dialog[open]{display:flex;flex-direction:column;height:300px;width:600px;max-width:92vw;padding:30px;margin:200px auto;opacity:1;transform:scaleY(1);gap:14px;text-align:left}
dialog::backdrop{background:rgb(15 12 41/0%)}
dialog[open]::backdrop{background:rgb(15 12 41/35%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#dialogCloseButton{position:absolute;top:10px;right:10px;margin-bottom:30px;padding:6px 14px;font-weight:600}
select{padding:10px 14px;border-radius:12px;font-size:16px;background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 var(--glass-hi);cursor:pointer}
select option{background:var(--opt-bg);color:var(--text)}

@keyframes flip-animation{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.flip-animation{animation:flip-animation 1s}
@keyframes slideOutBottom{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(100vw);opacity:1}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.7);--glass-strong:rgba(255,255,255,.85)}
}

@media screen and (max-width:900px){
  :root{--versionTagHeight:29px}
  .body{padding:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
  .versionTag{width:calc(var(--main-width-900) - 16px);margin:6px 8px;border-radius:16px;padding:4px 10px;min-height:var(--versionTagHeight)}
  .settings{margin:0}
  .game-board{width:var(--main-width-900);height:55vh;margin:0}
  .infoBox{width:calc(var(--main-width-900) - 24px);height:54vh;padding:20px;margin:0 12px;position:absolute;top:calc(var(--versionTagHeight) + 30px);background:var(--glass-strong)}
  .close-info{display:block}
  .showTheMeaningDiv{display:none}
  .game-board-row{height:16%;margin:0}
  .game-board-col{width:22%;margin:0}
  .letterInput{font-size:5vw !important}
  .keyboard{order:2;width:100%;margin-top:10px}
  .lang-char-info{display:none}
  .toastContainer{width:var(--main-width-900);padding-top:var(--versionTagHeight);bottom:0;left:0;justify-content:flex-start;flex-direction:column}
  .toast{margin-bottom:20px;animation:slideOutBottom 4s forwards}
  .askedWord{font-size:3vw;font-weight:800}
}

.ownNote{font-size:12px;line-height:1.5;color:var(--text-soft);margin-top:6px}

/* ===== Responsive hardening: fit any viewport, no clipping ===== */
:root{
  --main-width:clamp(360px,30vw,600px);
  --gap:4px;
  --key:clamp(30px,min(5.8dvh,12.5vw),50px);
}
body{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;
  justify-content:flex-start;overflow-x:hidden;overflow-y:auto;padding:6px 0 8px}
.versionTag{flex:0 0 auto;width:var(--main-width);max-width:calc(100% - 16px)}
.logoVersionTag{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game-board{flex:0 1 58dvh;min-height:140px;height:auto;width:var(--main-width);max-width:100%;margin:8px auto}
.game-board-row{height:calc(100% / 6) !important}
.keyboard{flex:0 0 auto;height:auto;width:var(--main-width);max-width:100%;margin:2px auto 6px;
  display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:var(--gap)}
.keyboard-button{width:var(--key);height:var(--key);font-size:clamp(12px,calc(var(--key) * .36),18px);padding:0}
.wide-button{width:calc(var(--key) * 2 + var(--gap))}
.lang-char-info{flex:0 0 100%;font-size:11px;color:var(--text-soft)}
.infoBox{max-height:calc(100dvh - 40px);overflow-y:auto}
.largeMessageBox{height:auto !important;min-height:140px;max-height:calc(100dvh - 70px);overflow-y:auto}
dialog[open]{position:fixed;inset:0;margin:auto;height:fit-content;min-height:240px;max-height:calc(100dvh - 24px);
  width:min(600px,calc(100vw - 24px));overflow:auto;padding:56px 24px 24px}
@media (pointer:coarse){.settings{width:40px;height:40px}}

@media screen and (max-width:900px){
  body{padding-top:0}
  .versionTag{width:calc(100% - 16px);margin:6px 8px}
  .game-board{width:100%;height:auto;margin:6px 0}
  .keyboard{width:100%}
  /* overlays fill the screen (above the keyboard) and scroll inside themselves */
  .infoBox{position:fixed !important;top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;right:12px;bottom:12px;
    width:auto;height:auto;max-height:none;margin:0;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .largeMessageBox{left:12px;right:12px;top:58px;width:auto !important;margin:0;padding:24px 18px}
  .close-info{width:min(320px,80%);margin:16px auto 4px}
}
@media screen and (max-width:900px) and (max-height:700px){
  .infoBox{padding:12px 16px;line-height:1.4;font-size:13px}
  .infoBox h5{margin-bottom:4px}
  .largeMessageBox{padding:16px 14px;font-size:16px}
  .largeMessageBox p{padding-top:12px;font-size:16px}
  .close-info{margin-top:10px;padding:10px 16px}
}
/* short landscape phones: keep the board square-ish and centred */
@media screen and (max-height:520px) and (orientation:landscape){
  .game-board{width:min(100%,62dvh)}
  .versionTag{max-width:420px;margin:4px auto}
}
dialog div,dialog label{min-width:0;max-width:100%}
dialog select{display:block;width:100%;max-width:100%;min-width:0;margin-top:8px;text-overflow:ellipsis}
dialog p{overflow-wrap:anywhere}

/* ===== Settings modal (tabbed; add more tabs later) ===== */
dialog.settingsDialog[open]{display:flex;flex-direction:column;padding:0;gap:0;min-height:0;overflow:hidden;
  width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
.settingsHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--glass-border);flex:0 0 auto}
.settingsHeader h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.settingsDialog #dialogCloseButton{position:static;margin:0;padding:6px 14px;font-weight:600}
.settingsBody{display:flex;flex:1 1 auto;min-height:260px;overflow:hidden}
.settingsTabs{display:flex;flex-direction:column;gap:6px;padding:14px;min-width:160px;border-right:1px solid var(--glass-border);overflow-y:auto}
.settingsTab{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;
  background:transparent;box-shadow:none;border-color:transparent}
.settingsTab[aria-selected="true"]{background:var(--glass-strong);border-color:var(--glass-border);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi)}
.settingsPanels{flex:1 1 auto;min-width:0;overflow-y:auto;padding:18px 20px}
.settingsPanel[hidden]{display:none}
.settingsPanel h3{font-size:16px;font-weight:800;margin-bottom:6px}
.settingsPanel p{color:var(--text-soft);font-size:14px;line-height:1.5}
.langList{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.langOption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;font-size:16px;font-weight:600;text-align:left}
.langCheck{opacity:0;font-weight:800;color:#10b981}
.langOption[aria-checked="true"]{background:var(--glass-strong);border-color:#10b981;box-shadow:0 0 0 2px rgba(16,185,129,.35),var(--shadow-sm)}

@media screen and (max-width:560px){
  .settingsBody{flex-direction:column;min-height:0}

  .settingsTab{white-space:nowrap;flex:0 0 auto}
  .settingsPanels{padding:14px 16px}
  .langList{grid-template-columns:1fr}
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

/* ===== Game bar: countdown + skip ===== */
:root{
  --t-warn:#b45309; --t-danger:#be123c;
  --t-glow:rgba(34,211,238,.38); --t-bar-a:#22d3ee; --t-bar-b:#8b5cf6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--t-warn:#fcd34d;--t-danger:#fda4af;--t-glow:rgba(34,211,238,.45)}
}
:root[data-theme="dark"]{--t-warn:#fcd34d;--t-danger:#fda4af;--t-glow:rgba(34,211,238,.45)}

.gameBar{display:flex;align-items:stretch;justify-content:center;gap:10px;flex:0 0 auto;
  width:var(--main-width);max-width:calc(100% - 16px);margin:6px auto 0}
.gameBar.timerOn{justify-content:space-between}
.skipBtn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;
  border-radius:16px;font-size:14px;font-weight:700;white-space:nowrap}
.skipBtn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}

.timer{container-type:inline-size;--t-digit:var(--text);position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:6px 14px 11px;border-radius:18px;overflow:hidden;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),0 0 26px var(--t-glow);
  transition:box-shadow .3s,border-color .3s,opacity .3s}
.timerIcon{font-size:clamp(18px,4vw,24px);filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.timerDigits{display:flex;align-items:baseline;
  font:800 clamp(30px,6.4vw,44px)/1 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:clamp(30px,6.4vw,44px);font-size:clamp(24px,13cqw,44px);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--t-digit);
  text-shadow:0 0 18px var(--t-glow),0 2px 6px rgba(0,0,0,.15)}
.tColon{margin:0 .04em;animation:tColon 1s steps(1,end) infinite}
@keyframes tColon{0%{opacity:1}50%{opacity:.25}}
.timerBar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.28)}
.timerBar i{display:block;width:100%;height:100%;transform-origin:left center;transform:scaleX(1);
  background:linear-gradient(90deg,var(--t-bar-a),var(--t-bar-b));transition:transform .25s linear;
  box-shadow:0 0 10px var(--t-glow)}
.timer.warn{--t-digit:var(--t-warn);--t-glow:rgba(245,158,11,.5);--t-bar-a:#fbbf24;--t-bar-b:#f97316}
.timer.danger{--t-digit:var(--t-danger);--t-glow:rgba(244,63,94,.6);--t-bar-a:#fb7185;--t-bar-b:#e11d48;
  border-color:rgba(244,63,94,.6);animation:tPulse 1s ease-in-out infinite}
@keyframes tPulse{0%,100%{box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),0 0 18px rgba(244,63,94,.4)}
  50%{box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),0 0 40px rgba(244,63,94,.8)}}
.timer.paused{opacity:.6}
.timer.paused .tColon,.timer.waiting .tColon,.timer.paused.danger{animation:none}
@media (prefers-reduced-motion:reduce){.tColon,.timer.danger{animation:none}.timerBar i{transition:none}}

@media screen and (max-width:900px){
  .gameBar{width:min(calc(100% - 16px),520px)}
}
@media screen and (max-width:380px){
  .skipBtn{padding:8px 10px;font-size:13px}
  .skipBtn span[aria-hidden]{display:none}
  .gameBar{gap:6px}
}

/* score panel: which mode these numbers belong to */
.scoreMode{display:inline-block;margin-bottom:8px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;background:var(--glass-strong);border:1px solid var(--glass-border)}

/* ===== Settings: Game mode panel ===== */
.modeList{display:grid;gap:10px;margin-top:14px}
.modeOption{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px}
.modeIcon{font-size:22px;flex:0 0 auto}
.modeText{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.modeText strong{font-size:16px;font-weight:700}
.modeText small{color:var(--text-soft);font-weight:500;font-size:13px;line-height:1.4}
.modeOption[aria-checked="true"]{background:var(--glass-strong);border-color:#10b981;box-shadow:0 0 0 2px rgba(16,185,129,.35),var(--shadow-sm)}
.modeOption[aria-checked="true"] .langCheck{opacity:1}
.timerSetup{margin-top:14px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
.timerSetup[hidden]{display:none}
.timerSetupLabel{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.timerSetupLabel output{font:800 20px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.timerSetup input[type=range]{display:block;width:100%;margin:12px 0 12px;height:28px;accent-color:#8b5cf6;cursor:pointer}
.presetList{display:flex;flex-wrap:wrap;gap:8px}
.presetChip{min-width:44px;min-height:40px;padding:8px 10px;border-radius:12px;font-weight:700;font-size:14px}
.presetChip[aria-pressed="true"]{background:var(--glass-strong);border-color:#8b5cf6;box-shadow:0 0 0 2px rgba(139,92,246,.35),var(--shadow-sm)}
.settingsNote{margin-top:12px;font-size:12px !important}

/* ===== Result messages (found / lost / time up / skipped) ===== */
.largeMessageBox.msgBox{--mc:#10b981;--mg:rgba(16,185,129,.38);display:flex;align-items:center;gap:12px;text-align:left;
  height:auto !important;min-height:0;max-height:calc(100dvh - 24px);padding:14px 18px;font-size:16px;font-weight:600;line-height:1.4;
  border-radius:20px;border-left:5px solid var(--mc);transform:translateY(-50%);
  background:var(--msg-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),0 0 30px var(--mg);
  animation:msgIn .3s ease-out}
.msgBox.msg-fail,.msgBox.msg-timeup{--mc:#f43f5e;--mg:rgba(244,63,94,.4)}
.msgBox.msg-skip{--mc:#f59e0b;--mg:rgba(245,158,11,.4)}
.msgIcon{flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;
  font-size:17px;font-weight:800;color:#fff;background:var(--mc);box-shadow:0 4px 14px var(--mg),inset 0 1px 0 rgba(255,255,255,.45)}
.msgBox .msgText{min-width:0;overflow-wrap:anywhere}
.largeMessageBox.msgBox .msgText .askedWord{font-size:inherit !important;font-weight:700;color:#ec4899;padding:0 .1em}
@keyframes msgIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.largeMessageBox.msgBox{animation:none}}

/* near-opaque so the message stays readable over the score panel on phones */
:root{--msg-bg:rgba(255,255,255,.94)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--msg-bg:rgba(38,32,88,.95)}}
:root[data-theme="dark"]{--msg-bg:rgba(38,32,88,.95)}

/* gear icon is a dark PNG: flip it on dark themes */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.settings img{filter:invert(1) brightness(1.1)}}
:root[data-theme="dark"] button.settings img{filter:invert(1) brightness(1.1)}

/* Install app (PWA) button in the header */
.actionButtons{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.installApp{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:12px;font-size:17px;font-weight:800;line-height:1}
.installApp .installLabel{display:none}
</style>
